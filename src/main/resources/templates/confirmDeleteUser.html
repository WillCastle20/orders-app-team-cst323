
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete User</title>
</head>
<body>
    <h1>Confirm User Deletion</h1>

    <p>Are you sure you want to delete this user?</p>

    <p>
        <strong>Username:</strong>
        <span th:text="${user.username}"></span>
    </p>

    <p>
        <strong>Role:</strong>
        <span th:text="${user.role}"></span>
    </p>

    <form th:action="@{/admin/users/delete/{id}(id=${user.id})}"
          method="post">

        <button type="submit">Yes, Delete User</button>
    </form>

    <p>
        <a th:href="@{/admin/users}">Cancel</a>
    </p>
</body>
</html>
